<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur MP3</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
    <link rel="icon" sizes="any" href="{{ url_for('static', filename='icon.ico') }}">
    <!-- Bundled copy of Tailwind, so the page is styled without an internet connection -->
    <script src="{{ url_for('static', filename='tailwind-3.4.17.js') }}"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        // Saved choice wins; otherwise follow the system theme
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
        const startDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', startDark);
    </script>
    <style>
        input[type="text"]::placeholder { color: #71717a; }
        .dark input[type="text"]::placeholder { color: #a1a1aa; }
        #logArea::-webkit-scrollbar { width: 8px; }
        #logArea::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.5); border-radius: 4px; }

        /* Faint dot grid over the page background */
        .backdrop-grid {
            background-image: radial-gradient(rgba(24, 24, 27, 0.13) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .dark .backdrop-grid { background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px); }

        /* While running, the bar is a moving gradient; end states use a flat colour */
        #progressBar.bg-indigo-500 {
            background-image: linear-gradient(90deg, #6366f1, #d946ef, #6366f1);
            background-size: 200% 100%;
            animation: bar-slide 1.6s linear infinite;
        }
        @keyframes bar-slide { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) { #progressBar.bg-indigo-500 { animation: none; } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-black text-zinc-950 dark:text-white min-h-screen px-4 py-12 font-sans antialiased">
    <!-- Decorative backdrop -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="backdrop-grid absolute inset-0"></div>
        <div class="absolute -top-40 -left-32 w-[32rem] h-[32rem] rounded-full bg-indigo-400/40 dark:bg-indigo-600/30 blur-3xl"></div>
        <div class="absolute -bottom-48 -right-32 w-[34rem] h-[34rem] rounded-full bg-fuchsia-400/30 dark:bg-fuchsia-600/20 blur-3xl"></div>
    </div>

    <main class="max-w-xl mx-auto">
        <header class="mb-8 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="shrink-0 w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 shadow-lg shadow-indigo-500/40 flex items-center justify-center text-white">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" data-i18n-html="heading"></h1>
                    <p class="text-zinc-600 dark:text-zinc-300 text-sm mt-0.5" data-i18n="subtitle"></p>
                </div>
            </div>
            <div class="shrink-0 flex items-center gap-2">
            <div role="group" data-i18n-title="langTitle" class="flex h-10 p-1 gap-1 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm text-xs font-semibold text-zinc-700 dark:text-zinc-200">
                <button data-lang="fr" onclick="setLang('fr')" class="px-2.5 rounded-lg transition-colors">FR</button>
                <button data-lang="en" onclick="setLang('en')" class="px-2.5 rounded-lg transition-colors">EN</button>
            </div>
            <button id="themeBtn" onclick="toggleTheme()" data-i18n-title="themeTitle"
                    class="shrink-0 w-10 h-10 flex items-center justify-center rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-800 dark:text-zinc-100 shadow-sm transition-colors">
                <!-- Sun: shown in dark mode -->
                <svg class="hidden dark:block w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <!-- Moon: shown in light mode -->
                <svg class="dark:hidden w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            </div>
        </header>

        <div class="bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-3xl p-6 space-y-6 shadow-xl shadow-zinc-900/10 dark:shadow-black/60">
            <!-- Mode -->
            <div role="tablist" class="grid grid-cols-2 p-1 gap-1 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-slate-50 dark:bg-black text-sm font-semibold text-zinc-700 dark:text-zinc-200">
                <button role="tab" data-mode="convert" onclick="setMode('convert')" class="py-2 rounded-lg transition-colors disabled:cursor-not-allowed" data-i18n="modeConvert"></button>
                <button role="tab" data-mode="tag" onclick="setMode('tag')" class="py-2 rounded-lg transition-colors disabled:cursor-not-allowed" data-i18n="modeTag"></button>
            </div>

            <!-- Source -->
            <div>
                <label for="inputDir" class="block text-xs font-semibold uppercase tracking-wider text-zinc-700 dark:text-zinc-200 mb-2" data-i18n="source"></label>
                <div class="flex gap-2">
                    <input type="text" id="inputDir" spellcheck="false"
                           class="flex-1 min-w-0 bg-slate-50 dark:bg-black border border-zinc-300 dark:border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/40 transition">
                    <button onclick="browseFolder('inputDir')"
                            class="shrink-0 inline-flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-700 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold px-3.5 py-2.5 rounded-xl transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span data-i18n="folder"></span>
                    </button>
                    <button onclick="browseFolder('inputDir', mode === 'tag' ? 'mp3' : 'file')"
                            class="shrink-0 inline-flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-700 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold px-3.5 py-2.5 rounded-xl transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></svg>
                        <span data-i18n="file"></span>
                    </button>
                </div>
                <p class="text-xs text-zinc-600 dark:text-zinc-300 mt-2" data-i18n="dropHint"></p>
            </div>

            <!-- Destination -->
            <div data-convert-only>
                <label for="outputDir" class="block text-xs font-semibold uppercase tracking-wider text-zinc-700 dark:text-zinc-200 mb-2" data-i18n="destination"></label>
                <div class="flex gap-2">
                    <input type="text" id="outputDir" data-i18n-placeholder="destPlaceholder" spellcheck="false"
                           class="flex-1 min-w-0 bg-slate-50 dark:bg-black border border-zinc-300 dark:border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/40 transition">
                    <button onclick="browseFolder('outputDir')"
                            class="shrink-0 inline-flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-700 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold px-3.5 py-2.5 rounded-xl transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span data-i18n="browse"></span>
                    </button>
                </div>
                <p id="outputPreview" class="text-xs font-medium text-indigo-700 dark:text-indigo-300 mt-2 break-all hidden"></p>
            </div>

            <!-- Options -->
            <div class="grid gap-3" data-convert-only>
                <label class="flex items-start gap-3 cursor-pointer select-none rounded-2xl border border-zinc-300 dark:border-zinc-700 p-4 transition-colors hover:border-zinc-400 dark:hover:border-zinc-500 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 dark:has-[:checked]:border-indigo-400 dark:has-[:checked]:bg-indigo-500/15">
                    <input type="checkbox" id="createFolder" onchange="syncOutputDir()" class="peer sr-only">
                    <span class="mt-0.5 shrink-0 w-9 h-5 rounded-full bg-zinc-400 dark:bg-zinc-600 peer-checked:bg-indigo-600 dark:peer-checked:bg-indigo-500 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-4 after:h-4 after:rounded-full after:bg-white after:shadow after:transition-transform peer-checked:after:translate-x-4"></span>
                    <span>
                        <span class="block text-sm font-semibold" data-i18n="createTitle"></span>
                        <span class="block text-xs text-zinc-600 dark:text-zinc-300 mt-0.5" data-i18n-html="createDesc"></span>
                    </span>
                </label>

                <label class="flex items-start gap-3 cursor-pointer select-none rounded-2xl border border-zinc-300 dark:border-zinc-700 p-4 transition-colors hover:border-zinc-400 dark:hover:border-zinc-500 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 dark:has-[:checked]:border-indigo-400 dark:has-[:checked]:bg-indigo-500/15">
                    <input type="checkbox" id="tagFiles" class="peer sr-only">
                    <span class="mt-0.5 shrink-0 w-9 h-5 rounded-full bg-zinc-400 dark:bg-zinc-600 peer-checked:bg-indigo-600 dark:peer-checked:bg-indigo-500 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-4 after:h-4 after:rounded-full after:bg-white after:shadow after:transition-transform peer-checked:after:translate-x-4"></span>
                    <span>
                        <span class="block text-sm font-semibold" data-i18n="tagTitle"></span>
                        <span class="block text-xs text-zinc-600 dark:text-zinc-300 mt-0.5" data-i18n="tagDesc"></span>
                    </span>
                </label>
            </div>

            <div>
                <p id="formError" class="text-sm font-medium text-red-700 dark:text-red-400 mb-3 hidden"></p>
                <div class="flex gap-2">
                <button id="startBtn" onclick="startRun()"
                        class="flex-1 bg-gradient-to-r from-indigo-600 to-fuchsia-600 hover:from-indigo-500 hover:to-fuchsia-500 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 active:scale-[0.99] transition"></button>
                <button id="cancelBtn" onclick="cancelRun()" data-i18n="cancel"
                        class="hidden shrink-0 px-5 rounded-xl border border-red-300 dark:border-red-500/60 bg-white dark:bg-zinc-900 hover:bg-red-50 dark:hover:bg-red-500/15 disabled:opacity-60 disabled:cursor-not-allowed text-red-700 dark:text-red-400 text-sm font-semibold transition-colors"></button>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div id="progressSection" class="bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-3xl p-6 mt-4 shadow-xl shadow-zinc-900/10 dark:shadow-black/60 hidden">
            <div class="flex justify-between items-baseline text-sm mb-2">
                <span id="progressText" class="font-semibold"></span>
                <span id="progressPercent" class="text-zinc-600 dark:text-zinc-300 font-medium tabular-nums">0%</span>
            </div>
            <div class="w-full bg-zinc-200 dark:bg-zinc-700 rounded-full h-2 overflow-hidden">
                <div id="progressBar" class="bg-indigo-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div id="logArea" class="mt-4 h-48 overflow-y-auto font-mono text-xs leading-5 bg-slate-50 dark:bg-black border border-zinc-300 dark:border-zinc-700 rounded-xl p-3"></div>

            <!-- End-of-run summary -->
            <div id="summary" class="hidden mt-4">
                <div id="summaryStats" class="grid grid-cols-3 gap-2"></div>
                <div class="flex flex-wrap gap-2 mt-3">
                    <button id="openBtn" onclick="openOutput()"
                            class="inline-flex items-center gap-1.5 bg-zinc-900 hover:bg-zinc-700 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold px-3.5 py-2.5 rounded-xl transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span data-i18n="openFolder"></span>
                    </button>
                    <button id="retryBtn" onclick="retryFailed()"
                            class="hidden inline-flex items-center gap-1.5 border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-sm font-semibold px-3.5 py-2.5 rounded-xl transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
                        <span data-i18n="retryFailed"></span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Shown while a file or folder is dragged over the window -->
    <div id="dropOverlay" class="hidden fixed inset-0 z-50 p-4 bg-indigo-600/20 backdrop-blur-sm pointer-events-none">
        <div class="w-full h-full flex items-center justify-center rounded-3xl border-4 border-dashed border-indigo-500 text-xl font-bold text-indigo-900 dark:text-white" data-i18n="dropHere"></div>
    </div>

        const SOURCE_EXTENSIONS = {{ extensions|tojson }};

        // French unless the user picked English before
        let lang = 'fr';
        try { if (localStorage.getItem('lang') === 'en') lang = 'en'; } catch (e) {}

        function t(key, params = {}) {
            const entry = I18N[lang][key];
            if (entry === undefined) return params.msg || key;
            return typeof entry === 'function' ? entry(params) : entry;
        }

        // 'convert' or 'tag' (tag existing MP3s without converting)
        let mode = 'convert';
        // Everything shown after page load is kept as a key + params so it can be re-rendered on language change
        let stopped = false;
        let running = false;
        let logEntries = [];
        let progressState = { key: 'starting', params: {} };
        let formErrorKey = '';
        // The run in progress (or the last one): what was asked, and what came of it
        let run = null;

        function setLang(newLang) {
            lang = newLang;
            try { localStorage.setItem('lang', lang); } catch (e) {}
            applyLang();
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.dataset.i18nTitle);
                el.setAttribute('aria-label', el.title);
            });
            document.querySelectorAll('[data-lang]').forEach(btn => setActive(btn, btn.dataset.lang === lang));
            document.getElementById('progressText').innerText = t(progressState.key, progressState.params);
            showFormError(formErrorKey);
            applyMode();
            renderLog();
            renderSummary();
        }

        function setActive(btn, active) {
            btn.setAttribute(btn.getAttribute('role') === 'tab' ? 'aria-selected' : 'aria-pressed', active);
            btn.classList.toggle('bg-zinc-900', active);
            btn.classList.toggle('text-white', active);
            btn.classList.toggle('dark:bg-white', active);
            btn.classList.toggle('dark:text-zinc-950', active);
        }

        function setMode(newMode) {
            if (running) return;
            mode = newMode;
            showFormError('');
            applyMode();
        }

        function applyMode() {
            const tagMode = mode === 'tag';
            document.querySelectorAll('[data-mode]').forEach(btn => {
                setActive(btn, btn.dataset.mode === mode);
                btn.disabled = running;
            });
            document.querySelectorAll('[data-convert-only]').forEach(el => el.classList.toggle('hidden', tagMode));
            document.getElementById('inputDir').placeholder = t(tagMode ? 'sourcePlaceholderTag' : 'sourcePlaceholder');
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = running;
            if (running) startBtn.innerText = t(run.mode === 'tag' ? 'tagging' : 'converting');
            else startBtn.innerText = t(tagMode ? 'tagAction' : 'convert');
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn.classList.toggle('hidden', !running);
            cancelBtn.innerText = t(cancelBtn.disabled ? 'cancelling' : 'cancel');
            syncOutputDir();
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
        }

        async function browseFolder(inputId, type = 'folder') {
            try {
                const response = await fetch('/browse?type=' + type);
                const data = await response.json();
                if (data.path) {
                    document.getElementById(inputId).value = data.path;
                    syncOutputDir();
                }
            } catch (error) {
                console.error("Failed to open folder browser:", error);
            }
        }

        // When auto-creating, preview where "<source name>_mp3" will end up
        function syncOutputDir() {
            const auto = document.getElementById('createFolder').checked;
            const preview = document.getElementById('outputPreview');
            let inputDir = document.getElementById('inputDir').value.trim().replace(/[\\/]+$/, '');
            const extension = SOURCE_EXTENSIONS.find(ext => inputDir.toLowerCase().endsWith(ext));
            if (extension) inputDir = inputDir.slice(0, -extension.length);
            const outputDir = document.getElementById('outputDir').value.trim().replace(/[\\/]+$/, '');
            document.getElementById('outputDir').placeholder = t(auto ? 'destPlaceholderAuto' : 'destPlaceholder');
            preview.classList.toggle('hidden', !auto || !inputDir);
            if (auto && inputDir) {
                const name = inputDir.split(/[\\/]/).pop() + '_mp3';
                preview.innerText = t('savingTo', { path: outputDir ? outputDir + '\\' + name : inputDir + '_mp3' });
            }
        }
        document.getElementById('inputDir').addEventListener('input', syncOutputDir);
        document.getElementById('outputDir').addEventListener('input', syncOutputDir);

        // Drag and drop. A page can't read the path of a dropped file, so the app window reports it through onDropPath()
        const dropOverlay = document.getElementById('dropOverlay');
        const draggingFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
        window.addEventListener('dragover', e => {
            if (!draggingFiles(e)) return;
            e.preventDefault();
            dropOverlay.classList.toggle('hidden', running);
        }, true);
        window.addEventListener('dragleave', e => {
            if (!e.relatedTarget) dropOverlay.classList.add('hidden');
        }, true);
        window.addEventListener('drop', e => {
            if (!draggingFiles(e)) return;
            e.preventDefault();
            dropOverlay.classList.add('hidden');
            if (!window.pywebview && !running) showFormError('dropUnsupported');
        }, true);

        function onDropPath(path) {
            if (running) return;
            document.getElementById('inputDir').value = path;
            showFormError('');
            syncOutputDir();
        }

        function tagText(tag) {
            if (tag.code !== 'added') return t('tag_' + tag.code);
            const list = tag.added.map(([field, value]) => t('field_' + field) + (value ? ` (${value})` : '')).join(', ');
            return t('tag_added', { list, match: tag.match });
        }

        function logText(entry) {
            if (entry.key === 'tagLine') return t('tagLine', { text: tagText(entry.params.tag) });
            return t(entry.key, entry.params);
        }

        function appendLogLine(entry) {
            const logArea = document.getElementById('logArea');
            const line = document.createElement('div');
            line.className = entry.color;
            line.textContent = logText(entry);
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function log(key, params = {}, color = 'text-zinc-600 dark:text-zinc-300') {
            const entry = { key, params, color };
            logEntries.push(entry);
            appendLogLine(entry);
        }

        function renderLog() {
            document.getElementById('logArea').innerHTML = '';
            logEntries.forEach(appendLogLine);
        }

        function setProgress(key, params = {}) {
            progressState = { key, params };
            document.getElementById('progressText').innerText = t(key, params);
        }

        function showFormError(key) {
            formErrorKey = key;
            const formError = document.getElementById('formError');
            formError.textContent = key ? t(key) : '';
            formError.classList.toggle('hidden', !key);
        }

        function setBarColor(color) {
            const progressBar = document.getElementById('progressBar');
            progressBar.classList.remove('bg-indigo-500', 'bg-emerald-500', 'bg-amber-500', 'bg-red-500');
            progressBar.classList.add(color);
        }

        // Counts shown once a run has ended, with the actions that make sense for them
        function renderSummary() {
            const summary = document.getElementById('summary');
            const finished = run && run.finished;
            summary.classList.toggle('hidden', !finished);
            if (!finished) return;

            const stats = run.mode === 'tag'
                ? [['statTagged', run.tagged, 'text-emerald-700 dark:text-emerald-400'], ['statUnchanged', run.ok - run.tagged], ['statFailed', run.failed.length, 'text-amber-700 dark:text-amber-400']]
                : [['statConverted', run.ok, 'text-emerald-700 dark:text-emerald-400'], ['statFailed', run.failed.length, 'text-amber-700 dark:text-amber-400']];
            if (run.mode === 'convert' && run.body.tag) stats.push(['statTagged', run.tagged]);

            const statsEl = document.getElementById('summaryStats');
            statsEl.innerHTML = '';
            for (const [key, value, color] of stats) {
                const tile = document.createElement('div');
                tile.className = 'rounded-xl border border-zinc-300 dark:border-zinc-700 bg-slate-50 dark:bg-black px-3 py-2.5';
                const number = document.createElement('div');
                number.className = 'text-2xl font-bold tabular-nums ' + (value && color ? color : '');
                number.textContent = value;
                const label = document.createElement('div');
                label.className = 'text-xs font-medium text-zinc-600 dark:text-zinc-300';
                label.textContent = t(key);
                tile.append(number, label);
                statsEl.appendChild(tile);
            }
            document.getElementById('openBtn').classList.toggle('hidden', !run.outputDir);
            document.getElementById('retryBtn').classList.toggle('hidden', !run.failed.length);
        }

        function openOutput() {
            fetch('/open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: run.outputDir }) });
        }

        function retryFailed() {
            startRun({ ...run.body, only: run.failed }, run.mode);
        }

        function cancelRun() {
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn.disabled = true;
            cancelBtn.innerText = t('cancelling');
            fetch('/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job: run.body.job }) });
        }

        // retryBody / retryMode: run these again instead of reading the form
        async function startRun(retryBody, retryMode) {
            if (running) return;
            let body = retryBody;
            const runMode = retryMode || mode;
            if (!body) {
                const inputDir = document.getElementById('inputDir').value.trim();
                const outputDir = document.getElementById('outputDir').value.trim();
                const createFolder = document.getElementById('createFolder').checked;

                if (!inputDir) {
                    showFormError(runMode === 'tag' ? 'needSourceTag' : 'needSource');
                    return;
                }
                if (runMode === 'convert' && !outputDir && !createFolder) {
                    showFormError('needDest');
                    return;
                }
                body = runMode === 'tag' ? { input_dir: inputDir } : {
                    input_dir: inputDir,
                    output_dir: outputDir,
                    create_folder: createFolder,
                    tag: document.getElementById('tagFiles').checked
                };
            }
            showFormError('');

            // The id lets the Cancel button name this run to the app
            body = { ...body, job: Date.now().toString(36) + Math.random().toString(36).slice(2) };
            run = { mode: runMode, body, ok: 0, tagged: 0, failed: [], outputDir: '', finished: false };
            stopped = false;
            running = true;
            logEntries = [];
            document.getElementById('cancelBtn').disabled = false;
            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('logArea').innerHTML = '';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressPercent').innerText = '0%';
            setProgress('starting');
            setBarColor('bg-indigo-500');
            applyMode();
            renderSummary();

            try {
                const response = await fetch(runMode === 'tag' ? '/tag' : '/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));
                            handleStreamData(data);
                        }
                    }
                }
            } catch (error) {
                handleStreamData({ status: 'error', code: 'connection_lost', detail: error.message });
            } finally {
                running = false;
                applyMode();
                renderSummary();
            }
        }

        function handleStreamData(data) {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');

            if (data.status === 'error') {
                stopped = true;
                setProgress('stopped');
                setBarColor('bg-red-500');
                log(data.code, data, 'text-red-700 dark:text-red-400');
            } else if (data.status === 'info') {
                setProgress(data.code, data);
                log(data.code, data);
            } else if (data.status === 'start') {
                run.outputDir = data.output_dir;
                log('found', { n: data.total });
            } else if (data.status === 'progress') {
                const percent = Math.round((data.current / data.total) * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.innerText = `${percent}%`;
                setProgress('progress', { current: data.current, total: data.total });
            } else if (data.status === 'success') {
                log('converted', { file: data.file, renamed: data.renamed }, 'text-zinc-950 dark:text-white font-medium');
                if (data.tag) log('tagLine', { tag: data.tag }, 'text-zinc-600 dark:text-zinc-400 whitespace-pre-wrap');
                if (data.tag_error) log('tagFailed', { detail: data.tag_error }, 'text-amber-700 dark:text-amber-400 whitespace-pre-wrap');
                // When only tagging, a file whose lookup failed is a failed file
                if (run.mode === 'tag' && data.tag_error) run.failed.push(data.id);
                else run.ok++;
                if (data.tag && data.tag.code === 'added') run.tagged++;
            } else if (data.status === 'warning') {
                if (data.id) run.failed.push(data.id);
                log(data.code, data, 'text-amber-700 dark:text-amber-400');
            } else if (data.status === 'cancelled') {
                run.finished = true;
                setProgress('cancelled');
                setBarColor('bg-amber-500');
                log('cancelledLine', {}, 'text-amber-700 dark:text-amber-400');
            } else if (data.status === 'done' && !stopped) {
                run.finished = true;
                if (run.failed.length) {
                    setProgress('doneFailed', { n: run.failed.length });
                    setBarColor('bg-amber-500');
                } else {
                    setProgress('done');
                    setBarColor('bg-emerald-500');
                }
            }
        }

        applyLang();
    </script>
</body>
</html>
