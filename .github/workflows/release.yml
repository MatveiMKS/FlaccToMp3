name: Build release

on:
  push:
    tags: ['v*']
  # Manual run: builds the apps as downloadable artifacts, without creating a release
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: '8.1.2'
  # Its wheels carry a static FFmpeg for each Mac architecture
  IMAGEIO_FFMPEG_VERSION: '0.6.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (essentials build)
        shell: pwsh
        run: |
          $name = "ffmpeg-$env:FFMPEG_VERSION-essentials_build"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          Copy-Item "ffmpeg-dl/$name/bin/ffmpeg.exe" ffmpeg.exe
          Copy-Item "ffmpeg-dl/$name/LICENSE" FFmpeg-LICENSE.txt

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MP3Converter --add-data "templates;templates" --add-data "static;static" --add-binary "ffmpeg.exe;." app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $app = Start-Process dist/MP3Converter.exe -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep 2
              try {
                $page = Invoke-WebRequest http://127.0.0.1:5000/ -UseBasicParsing
                if ($page.Content -match 'MP3 Converter') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Packaged app did not serve the page' }
          } finally {
            taskkill /F /T /PID $app.Id
          }

      - name: Collect release files
        shell: pwsh
        run: Copy-Item FFmpeg-LICENSE.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MP3Converter
          path: |
            dist/MP3Converter.exe
            dist/FFmpeg-LICENSE.txt

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller "imageio-ffmpeg==$IMAGEIO_FFMPEG_VERSION"

      - name: Get FFmpeg (static build)
        run: |
          cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ffmpeg
          chmod +x ffmpeg
          ./ffmpeg -hide_banner -encoders | grep libmp3lame

      - name: Build app
        run: pyinstaller --noconfirm --windowed --name MP3Converter --osx-bundle-identifier com.mp3converter.app --add-data "templates:templates" --add-data "static:static" --add-binary "ffmpeg:." app.py

      - name: Smoke test
        run: |
          # The FFmpeg inside the bundle still runs after PyInstaller re-signed it
          "$(find dist/MP3Converter.app -type f -name ffmpeg | head -n 1)" -version
          PORT=5071 dist/MP3Converter.app/Contents/MacOS/MP3Converter &
          app=$!
          ok=
          for i in $(seq 30); do
            sleep 2
            if curl -fs http://127.0.0.1:5071/ | grep -q 'MP3 Converter'; then ok=1; break; fi
          done
          kill $app || true
          [ -n "$ok" ] || { echo 'Packaged app did not serve the page'; exit 1; }

      - name: Zip app
        # ditto keeps the symlinks and the signature of the bundle intact
        run: ditto -c -k --sequesterRsrc --keepParent dist/MP3Converter.app dist/MP3Converter-macOS-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MP3Converter-macOS-${{ matrix.arch }}
          path: dist/MP3Converter-macOS-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          **Windows**: download **MP3Converter.exe** and double-click it. Windows may show a SmartScreen warning because the app is unsigned: click **More info**, then **Run anyway**.

          **macOS**: download **MP3Converter-macOS-arm64.zip** (Apple Silicon: M1 and later) or **MP3Converter-macOS-x86_64.zip** (Intel), unzip it and open **MP3Converter**. The app is unsigned, so macOS blocks the first launch: open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**.

          Close the window to quit.

          Includes FFmpeg (GPL, see FFmpeg-LICENSE.txt): $FFMPEG_VERSION on Windows, the build from imageio-ffmpeg $IMAGEIO_FFMPEG_VERSION on macOS.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
